# Offline CI for the static frontend: no backend, no secrets.
#   - every script parses (node --check) - the site has no build step, so a
#     syntax error would otherwise only show up in a browser;
#   - the frontend server's tests (dev/test_serve.py).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every script parses
        run: for f in *.js; do node --check "$f"; done

      - name: Development server tests
        run: python -m unittest discover -s dev -p "test_*.py"

  # The page in a real browser, under its real Content-Security-Policy
  # (dev/serve.py sends it): the pinned LiveKit client loads, and
  # catalog data can't run script (tests/xss.spec.cjs).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser-test tooling (package-lock.json)
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        env:
          PYTHON: python
        run: npm run test:browser
